name: NonsenseApp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 24.x ]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run npm Install
        run: npm ci
      - name: Run npm lint
        run: npm run lint
      - name: Run formatting
        run: npm run format:check
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm run test
