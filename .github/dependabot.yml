version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      # Twice a month, on the 1st and 15th at 08:00 UTC.
      cronjob: "0 8 1,15 * *"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 8 1,15 * *"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
